<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mafia Noir</title>
<style>
/* ===================== MAFIA NOIR — dizayn tokenlari ===================== */
:root{
  --obsidian:#080A0F; --graphite:#111722; --midnight:#101D31;
  --panel:#0d121b; --panel-2:#141c29;
  --silver:#C8D1DE; --blue:#4D9FFF; --bordo:#8F2638; --bordo-hi:#c4475d;
  --text:#e6ebf2; --muted:#8a95a7; --faint:#5d6778;
  --line:rgba(200,209,222,.10); --line-2:rgba(200,209,222,.20);
  --ok:#6cbf95; --warn:#d6a755;
  --f-display:"Didot","Bodoni 72","Bodoni MT","Playfair Display","Libre Bodoni",Georgia,"Times New Roman",serif;
  --f-body:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --r:6px; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--obsidian);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(1200px 600px at 75% -10%, rgba(16,29,49,.95), transparent 60%),
   radial-gradient(900px 500px at -10% 110%, rgba(143,38,56,.10), transparent 60%),
   linear-gradient(180deg, #0a0d14, var(--obsidian));}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.06;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
#app{position:relative;z-index:1;min-height:100%;padding:24px max(16px,3vw)}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0}
.ico{display:inline-flex;width:18px;height:18px;flex:none}
.ico svg{width:100%;height:100%}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.serif{font-family:var(--f-display)}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent);border:0;margin:0}

/* ---------- tugmalar ---------- */
.btn{appearance:none;border:1px solid var(--line-2);background:rgba(200,209,222,.04);color:var(--text);
  font:inherit;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:11px 18px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:10px;justify-content:center;
  transition:background .2s var(--ease),border-color .2s var(--ease),color .2s,transform .15s var(--ease)}
.btn:hover{border-color:rgba(200,209,222,.4);background:rgba(200,209,222,.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.primary{background:var(--silver);color:var(--obsidian);border-color:var(--silver)}
.btn.primary:hover{background:#dde3ec}
.btn.danger{border-color:rgba(196,71,93,.55);color:#f0b6c0;background:rgba(143,38,56,.18)}
.btn.danger:hover{background:rgba(143,38,56,.32)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:rgba(200,209,222,.06)}
.btn.sm{padding:7px 11px;font-size:11px}
.btn.lg{padding:15px 28px;font-size:14px}
.btn.icon{padding:8px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;min-width:0}
input:focus,select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(77,159,255,.18)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);padding:0}
label{cursor:pointer}

/* ---------- umumiy panel ---------- */
.panel{background:linear-gradient(180deg,rgba(20,28,41,.72),rgba(13,18,27,.82));border:1px solid var(--line);border-radius:10px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 50px -20px rgba(0,0,0,.7);backdrop-filter:blur(6px)}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.page-head h1{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);letter-spacing:.01em}
.wordmark-sm{font-family:var(--f-display);letter-spacing:.32em;font-size:13px;color:var(--silver)}
.wordmark-sm b{color:var(--bordo-hi);font-weight:400}

/* ---------- bosh menyu ---------- */
.menu{min-height:calc(100vh - 48px);display:grid;place-items:center;text-align:center}
.menu-inner{display:flex;flex-direction:column;align-items:center;gap:28px;animation:rise .9s var(--ease) both}
.wordmark{font-family:var(--f-display);font-size:clamp(54px,11vw,120px);line-height:.9;letter-spacing:.06em;color:var(--silver);
  text-shadow:0 0 60px rgba(77,159,255,.15)}
.wordmark span{display:block;font-size:.34em;letter-spacing:1.1em;margin-right:-1.1em;color:var(--bordo-hi);margin-top:14px}
.motto{font-family:var(--f-display);font-style:italic;font-size:20px;color:var(--muted);letter-spacing:.04em}
.menu-actions{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.menu-actions .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-foot{font-size:12px;color:var(--faint);max-width:420px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- sozlash ---------- */
.setup-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.setup-grid{grid-template-columns:1fr}}
.section{padding:22px;display:flex;flex-direction:column;gap:16px}
.section h3{font-family:var(--f-display);font-size:22px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.stepper button{background:transparent;border:0;color:var(--text);width:38px;height:38px;cursor:pointer;font-size:18px}
.stepper button:hover{background:rgba(200,209,222,.08)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper output{min-width:46px;text-align:center;font-family:var(--f-mono);font-size:18px}
.role-rows{display:flex;flex-direction:column}
.role-row{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.role-row:first-child{border-top:0}
.role-row .rname{font-weight:600}
.role-row .rteam{font-size:12px;color:var(--muted)}
.medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--silver);background:radial-gradient(circle at 30% 25%,rgba(200,209,222,.12),transparent 70%)}
.medal.mafia{color:#f2b7c1;border-color:rgba(196,71,93,.5);background:radial-gradient(circle at 30% 25%,rgba(143,38,56,.4),transparent 70%)}
.medal.sheriff{color:#a9cdff;border-color:rgba(77,159,255,.45)}
.medal.doctor{color:#b7e4cf;border-color:rgba(108,191,149,.45)}
.medal .ico{width:20px;height:20px}
.sum-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);font-size:14px}
.sum-line.ok{border-color:rgba(108,191,149,.4);color:#bfe6d1}
.sum-line.bad{border-color:rgba(196,71,93,.55);color:#f3c2ca;background:rgba(143,38,56,.12)}
.errors{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.errors li{font-size:13px;color:#f3c2ca;padding-left:16px;position:relative}
.errors li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--bordo-hi);transform:rotate(45deg)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.names{grid-template-columns:1fr}}
.name-field{display:flex;align-items:center;gap:8px}
.name-field .seat{font-family:var(--f-mono);color:var(--faint);width:22px;text-align:right;font-size:12px}
.name-field input{flex:1;width:100%}
.field{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field .fl{display:flex;flex-direction:column;gap:2px;min-width:0}
.field .fl span{font-size:12px;color:var(--muted)}
.field select{min-width:150px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions .grow{flex:1}
.notice{font-size:13px;color:var(--muted);border-left:2px solid var(--blue);padding:4px 0 4px 12px}

/* ---------- rol ko'rish ---------- */
.reveal{min-height:calc(100vh - 48px);display:grid;place-items:center}
.reveal-card{width:min(560px,100%);padding:42px 36px;text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center;animation:rise .5s var(--ease) both}
.reveal-card h2{font-family:var(--f-display);font-size:clamp(26px,4vw,34px)}
.reveal-card .lead{color:var(--muted);font-size:16px;max-width:42ch}
.reveal-card input{width:100%;font-size:18px;text-align:center;padding:14px}
.progress-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.progress-dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.progress-dots i.done{background:var(--silver)}
.progress-dots i.cur{background:var(--blue);box-shadow:0 0 0 3px rgba(77,159,255,.25)}
.lock{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--silver)}
.lock .ico{width:28px;height:28px}
.role-card{position:relative;width:min(520px,100%);padding:44px 34px 34px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;
  border-radius:14px;border:1px solid var(--line-2);overflow:hidden;animation:flip .6s var(--ease) both;
  background:linear-gradient(160deg,var(--midnight),var(--obsidian) 70%)}
.role-card::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:8px;pointer-events:none}
.role-card.mafia{background:linear-gradient(160deg,#2a0d15,var(--obsidian) 72%);border-color:rgba(196,71,93,.5)}
.role-card.sheriff{background:linear-gradient(160deg,#0f2440,var(--obsidian) 72%);border-color:rgba(77,159,255,.45)}
.role-card.doctor{background:linear-gradient(160deg,#0f2620,var(--obsidian) 72%);border-color:rgba(108,191,149,.4)}
.role-card .big-ico{width:76px;height:76px;color:var(--silver)}
.role-card.mafia .big-ico{color:#f2b7c1}.role-card.sheriff .big-ico{color:#a9cdff}.role-card.doctor .big-ico{color:#b7e4cf}
.role-card .rtitle{font-family:var(--f-display);font-size:clamp(40px,8vw,58px);letter-spacing:.08em;line-height:1;text-transform:uppercase}
.role-card .rdesc{color:#c6cfdb;max-width:40ch;font-size:16px}
.role-card .rteam{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateY(-14deg) translateY(10px)}to{opacity:1;transform:none}}

/* ---------- boshlovchi paneli ---------- */
.host{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:12px 16px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;flex:1;min-width:0}
.stat{display:flex;flex-direction:column;gap:0}
.stat .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600}
.stat .v{font-family:var(--f-mono);font-size:18px;color:var(--text);display:flex;align-items:center;gap:6px}
.stat .v .ico{width:15px;height:15px;color:var(--muted)}
.stat.mafia .v{color:#f2b7c1}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.host-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.host-grid{grid-template-columns:1fr}}
.stage{padding:30px;min-height:520px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.stage.night{background:linear-gradient(180deg,rgba(9,14,26,.92),rgba(8,10,15,.95));}
.stage.night::before{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(77,159,255,.12),transparent 65%);pointer-events:none}
.stage.day{background:linear-gradient(180deg,rgba(24,33,48,.85),rgba(14,19,28,.9))}
.stage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.phase-tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.phase-tag .ico{width:16px;height:16px;color:var(--blue)}
.day .phase-tag .ico{color:var(--warn)}
.announce{font-family:var(--f-display);font-size:clamp(28px,4.4vw,46px);line-height:1.12;color:var(--silver);letter-spacing:.01em;animation:fadeup .8s var(--ease) both}
.announce .sub{display:block;font-size:.55em;color:var(--muted);margin-top:12px;font-style:italic}
.announce.cinema{text-align:center;margin:auto 0;padding:30px 0}
@keyframes fadeup{from{opacity:0;transform:translateY(8px);letter-spacing:.06em}to{opacity:1;transform:none}}
.cue{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.cue .ico{color:var(--blue);margin-top:2px}
.stage-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:auto}
.stage-actions .grow{flex:1}

.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick{appearance:none;font:inherit;text-align:left;cursor:pointer;color:var(--text);background:rgba(200,209,222,.03);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:2px;transition:border-color .15s,background .15s}
.pick:hover:not(:disabled){border-color:var(--line-2);background:rgba(200,209,222,.07)}
.pick .pn{font-weight:600;overflow-wrap:anywhere}
.pick .ps{font-size:11px;color:var(--faint);letter-spacing:.06em}
.pick[aria-pressed="true"]{border-color:var(--blue);background:rgba(77,159,255,.12);box-shadow:0 0 0 1px var(--blue) inset}
.pick.kill[aria-pressed="true"]{border-color:var(--bordo-hi);background:rgba(143,38,56,.22);box-shadow:0 0 0 1px var(--bordo-hi) inset}
.pick:disabled{opacity:.35;cursor:not-allowed;text-decoration:none}
.pick.dead .pn{text-decoration:line-through}

.private{border:1px dashed rgba(77,159,255,.45);border-radius:var(--r);padding:14px 16px;background:rgba(77,159,255,.06);display:flex;flex-direction:column;gap:8px}
.private .eyebrow{color:#9cc6ff;display:flex;align-items:center;gap:8px}
.private .verdict{font-family:var(--f-display);font-size:28px;letter-spacing:.06em}
.private .verdict.is-mafia{color:#f2b7c1}
.private .verdict.not-mafia{color:#bfe6d1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

.timer{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.timer .clock{font-family:var(--f-mono);font-size:clamp(44px,7vw,68px);line-height:1;letter-spacing:.02em;color:var(--silver);font-variant-numeric:tabular-nums}
.timer .clock.low{color:var(--bordo-hi)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;letter-spacing:.04em}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:rgba(200,209,222,.12);color:var(--text)}

.vote-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.vote-wrap{grid-template-columns:1fr}}
.vote-list{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow:auto;padding-right:4px}
.vote-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:center}
.vote-row .vn{font-weight:600;overflow-wrap:anywhere;font-size:14px}
.vote-row select{width:100%;padding:7px 9px;font-size:13px}
.vote-row.missing select{border-color:rgba(214,167,85,.5)}
.tally{display:flex;flex-direction:column;gap:8px}
.tbar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px}
.tbar .tn{display:flex;flex-direction:column;gap:4px;min-width:0}
.tbar .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .tr{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.tbar .tr i{display:block;height:100%;background:var(--silver);transition:width .25s var(--ease)}
.tbar.lead .tr i{background:var(--bordo-hi)}
.tbar .tc{font-family:var(--f-mono);text-align:right}
.vote-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.vote-meta b{color:var(--text);font-family:var(--f-mono);font-weight:500}

/* o'yinchilar ro'yxati */
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.plist{padding:6px 0}
.plist-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px}
.plist-head h3{font-family:var(--f-display);font-size:20px}
.prow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}
.prow .seat{font-family:var(--f-mono);font-size:12px;color:var(--faint);text-align:right}
.prow .pmain{display:flex;flex-direction:column;gap:3px;min-width:0}
.prow .pname{font-weight:600;overflow-wrap:anywhere}
.prow.out .pname{color:var(--faint);text-decoration:line-through}
.prow .pmeta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:3px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip .ico{width:12px;height:12px}
.chip.r-mafia{color:#f2b7c1;border-color:rgba(196,71,93,.5);background:rgba(143,38,56,.18)}
.chip.r-sheriff{color:#a9cdff;border-color:rgba(77,159,255,.4)}
.chip.r-doctor{color:#b7e4cf;border-color:rgba(108,191,149,.4)}
.chip.alive{color:#bfe6d1;border-color:rgba(108,191,149,.35)}
.chip.dead{color:var(--faint)}
.chip.tgt-k{color:#f2b7c1;border-color:var(--bordo-hi)}
.chip.tgt-d{color:#b7e4cf;border-color:var(--ok)}
.chip.tgt-s{color:#a9cdff;border-color:var(--blue)}
.chip.vote{color:var(--silver)}
.privacy-on .secret{filter:blur(7px);user-select:none}
.privacy-on .secret-hide{visibility:hidden}

.logs .tabs{display:flex;border-bottom:1px solid var(--line)}
.logs .tabs button{flex:1;appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:12px;cursor:pointer}
.logs .tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--silver)}
.loglist{list-style:none;margin:0;padding:8px 16px 14px;max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.loglist li{display:grid;grid-template-columns:42px 1fr;gap:10px}
.loglist .lr{font-family:var(--f-mono);color:var(--faint);font-size:11px;padding-top:2px}
.loglist .empty{display:block;color:var(--faint)}

/* ---------- yakun ---------- */
.end-hero{padding:44px 32px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.end-hero.mafia{background:linear-gradient(170deg,#2a0d15,var(--obsidian) 75%);border-color:rgba(196,71,93,.45)}
.end-hero.town{background:linear-gradient(170deg,#0f2440,var(--obsidian) 75%);border-color:rgba(77,159,255,.35)}
.end-hero h1{font-family:var(--f-display);font-size:clamp(36px,6vw,64px);letter-spacing:.04em}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);text-align:left;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line-2)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.winner td:first-child{box-shadow:inset 2px 0 0 var(--silver)}

/* ---------- qoidalar ---------- */
.prose{max-width:72ch;display:flex;flex-direction:column;gap:14px;color:#c9d1dc}
.prose h3{font-family:var(--f-display);font-size:22px;color:var(--text);margin-top:10px}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* ---------- modal va xabarlar ---------- */
.modal-back{position:fixed;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s both}
.modal{width:min(460px,100%);padding:26px;display:flex;flex-direction:column;gap:16px;animation:rise .3s var(--ease) both}
.modal h3{font-family:var(--f-display);font-size:24px}
.modal .body{color:#c6cfdb}
.modal .actions{justify-content:flex-end}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{padding:12px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel-2);font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:rise .3s var(--ease) both}
.toast.err{border-color:rgba(196,71,93,.6);color:#f3c2ca}
.toast.warn{border-color:rgba(214,167,85,.55);color:#efd6a5}
.toast.ok{border-color:rgba(108,191,149,.5);color:#bfe6d1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- ovoz paneli ---------- */
#sound-dock{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:40;
  display:flex;align-items:center;gap:4px;padding:5px 10px 5px 5px;border-radius:999px}
.dock-btn{appearance:none;border:0;background:transparent;color:var(--silver);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative}
.dock-btn:hover{background:rgba(200,209,222,.1)}
.dock-btn[aria-pressed="false"]{color:var(--faint)}
.dock-btn[aria-pressed="false"]::after{content:"";position:absolute;width:22px;height:1.6px;background:var(--bordo-hi);transform:rotate(-45deg);border-radius:1px}
#dock-sound[aria-pressed="false"]::after{display:none}
#sound-dock.muted-all #dock-music,#sound-dock.muted-all #dock-vol{opacity:.35}
input[type=range]{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:0;height:20px;width:96px;box-shadow:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line-2);border-radius:2px}
input[type=range]::-moz-range-track{height:3px;background:var(--line-2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--silver);margin-top:-5.5px;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--silver);border:0}
.range-wrap{display:flex;align-items:center;gap:10px}
.range-wrap input[type=range]{width:150px}
.range-wrap .mono{min-width:4ch;text-align:right;font-size:12px}
#app{padding-bottom:84px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){#app{padding:16px}.stage{padding:20px;min-height:0}.section{padding:18px}.reveal-card{padding:30px 20px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="sound-dock" class="panel" role="group" aria-label="Ovoz boshqaruvi"></div>
<input type="file" id="import-file" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">

<script>
(function(){
'use strict';

/* =====================================================================
   1. YORDAMCHI FUNKSIYALAR
   ===================================================================== */
var STORE_SETTINGS = 'mafiaNoir.settings.v1';
var STORE_GAME = 'mafiaNoir.game.v1';
var FORMAT_VERSION = 1;

function $(sel, root){ return (root || document).querySelector(sel); }

/* Xavfsiz DOM quruvchi: foydalanuvchi matni har doim textContent orqali kiradi. */
function h(tag, props){
  var el = document.createElement(tag);
  props = props || {};
  Object.keys(props).forEach(function(k){
    var v = props[k];
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.slice(0,2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked') el.checked = !!v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, String(v));
  });
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, c){
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(function(x){ append(el, x); }); return; }
  el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }

/* Kriptografik tasodifiylik + Fisher–Yates */
function randInt(n){
  if (window.crypto && window.crypto.getRandomValues) {
    var limit = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1), x;
    do { window.crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % n;
  }
  return Math.floor(Math.random() * n);
}
function shuffleFY(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = randInt(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
var store = {
  get: function(k){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function fmtTime(sec){ sec = Math.max(0, sec|0); var m = Math.floor(sec/60), s = sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }

/* Bir xil uslubdagi chiziqli SVG ikonkalar (statik, foydalanuvchi matni yo'q) */
var ICONS = {
  mafia:'<path d="M3 15.2c2.6 1.7 5.6 2.5 9 2.5s6.4-.8 9-2.5"/><path d="M6.2 14.6 7.4 8c.2-1.1 1.4-1.7 2.4-1.2L12 7.8l2.2-1c1-.5 2.2.1 2.4 1.2l1.2 6.6"/><path d="M6.8 12.2c3.3 1 7.1 1 10.4 0"/>',
  doctor:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5v9M7.5 12h9"/>',
  sheriff:'<path d="M12 3.2l2.5 5.3 5.8.7-4.3 4 1.1 5.7L12 16.1 6.9 18.9 8 13.2l-4.3-4 5.8-.7z"/><circle cx="12" cy="11.8" r="1.6"/>',
  citizen:'<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.6-4 3.6-6.3 7.5-6.3s6.9 2.3 7.5 6.3"/>',
  moon:'<path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M2.5 12S6 5.5 12 5.5c2 0 3.7.7 5.1 1.6M21.5 12s-3.5 6.5-9.5 6.5c-2 0-3.7-.7-5.1-1.6"/><path d="M4 4l16 16"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H10"/>',
  next:'<path d="M5 12h13M13 6l6 6-6 6"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  shuffle:'<path d="M16 3.5h4.5V8"/><path d="M4 20 20.5 3.5"/><path d="M20.5 16v4.5H16"/><path d="M15 15l5.5 5.5"/><path d="M4 4l5 5"/>',
  download:'<path d="M12 3.5v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 20.5h14"/>',
  upload:'<path d="M12 20.5v-11"/><path d="M7.5 13.5 12 9l4.5 4.5"/><path d="M5 3.5h14"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
  book:'<path d="M4.5 5.5A2 2 0 0 1 6.5 3.5h13v15h-13a2 2 0 0 0-2 2z"/><path d="M4.5 20.5v-15"/>',
  play:'<path d="M7.5 5v14l11-7z"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  reset:'<path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4.5v4.5H8"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.6 3.1-5.6 6.5-5.6s6 2 6.5 5.6"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4"/><path d="M17.8 14.6c2 .6 3.4 2.4 3.7 5.4"/>',
  ballot:'<path d="M4 11h16v9.5H4z"/><path d="M8.5 11 10 4.5h4l1.5 6.5"/><path d="M9 15.5h6"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  out:'<circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>',
  music:'<path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  speaker:'<path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6M18.6 6.4a8.2 8.2 0 0 1 0 11.2"/>',
  mute:'<path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>',
  bell:'<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  target:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/>'
};
function icon(name, cls){
  var s = h('span', {class: 'ico ' + (cls || ''), 'aria-hidden': 'true'});
  s.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';
  return s;
}
function btn(label, opts){
  opts = opts || {};
  var b = h('button', {type:'button', class:'btn ' + (opts.cls || ''), onclick: opts.onClick, disabled: opts.disabled, 'aria-label': opts.aria, title: opts.title, 'data-primary': opts.primary ? '1' : null, id: opts.id});
  if (opts.icon) b.appendChild(icon(opts.icon));
  if (label) b.appendChild(document.createTextNode(label));
  return b;
}

/* =====================================================================
   2. SOZLAMALAR VA ROLLAR TIZIMI (kengaytirishga qulay)
   ===================================================================== */
var DEFAULT_SETTINGS = {
  extendedRange: false,          // false: 8–12, true: 4–20
  sheriffName: 'Komissar',       // 'Komissar' | 'Sherif'
  doctorSelfHeal: true,
  votingEnabled: true,
  allMustVote: false,
  allowAbstain: true,
  allowSelfVote: false,
  voteTimer: 60,                 // soniya, 0 = cheklanmagan
  tieRule: 'revote',             // 'revote' | 'none'
  revoteEnabled: true,
  revealRoleOnVote: false,
  revealRoleOnNight: false,
  discussionDefault: 120,        // soniya, 0 = cheklanmagan
  // Ovoz va musiqa
  soundOn: true,                 // umumiy ovoz
  musicOn: true,                 // fon musiqasi
  sfxOn: true,                   // ovoz effektlari
  uiClicks: true,                // tugma tovushlari
  timerSounds: true,             // taymer chiqillashi va signali
  nightMask: true,               // tunda musiqa balandroq (shivir-shivirni yashiradi)
  notifications: true,           // bildirishnomalar (xatolar doim ko'rinadi)
  masterVol: 0.8, musicVol: 0.55, sfxVol: 0.85
};

/*
  Yangi rol qo'shish uchun shu ro'yxatga bitta obyekt qo'shing:
  id, team ('mafia' | 'town'), name(), icon, desc(), ixtiyoriy night { order, key, prompt(), confirm, eligible(player, actor) }.
  Tungi hisob-kitobni kengaytirish uchun resolveNight() funksiyasiga qarang.
*/
var ROLES = [
  { id:'mafia', team:'mafia', icon:'mafia',
    name: function(){ return 'Mafiya'; },
    desc: function(){ return 'Sizning vazifangiz — shaharliklar orasida yashirinib qolish va mafiya jamoasining g‘alabasiga erishish. Har tunda sheriklaringiz bilan birga bitta nishon tanlaysiz.'; },
    night: { order:10, key:'mafiaTarget', confirm:'Tanlovni tasdiqlash', tone:'kill',
      prompt: function(){ return 'Mafiya tanlagan nishonni belgilang.'; },
      eligible: function(p){ return p.alive && p.role !== 'mafia'; },
      blockedNote: function(p){ return p.role === 'mafia' ? 'mafiya a’zosi' : ''; } } },
  { id:'doctor', team:'town', icon:'doctor',
    name: function(){ return 'Shifokor'; },
    desc: function(){ return 'Har tunda bitta o‘yinchini himoya qilasiz. Mafiya aynan shu o‘yinchini tanlasa, u tirik qoladi.' + (S.settings.doctorSelfHeal ? ' O‘zingizni ham davolashingiz mumkin.' : ' O‘zingizni davolay olmaysiz.'); },
    night: { order:20, key:'doctorTarget', confirm:'Davolashni tasdiqlash', tone:'heal',
      prompt: function(){ return 'Shifokor davolagan o‘yinchini belgilang.'; },
      eligible: function(p){ return p.alive && (S.settings.doctorSelfHeal || p.role !== 'doctor'); },
      blockedNote: function(p){ return p.role === 'doctor' && !S.settings.doctorSelfHeal ? 'o‘zini davolash o‘chirilgan' : ''; } } },
  { id:'sheriff', team:'town', icon:'sheriff',
    name: function(){ return S.settings.sheriffName; },
    desc: function(){ return 'Har tunda bitta o‘yinchini tekshirasiz va u mafiya ekanini yoki emasligini bilib olasiz. Tekshiruv hech kimni o‘yindan chiqarmaydi: kunduzi dalil keltirib, boshqalarni ishontiring. Rolingizni oshkor qilish — sizning strategiyangiz.'; },
    night: { order:30, key:'sheriffTarget', confirm:'Tekshiruvni tasdiqlash', tone:'check',
      prompt: function(){ return S.settings.sheriffName + ' tekshirgan o‘yinchini belgilang.'; },
      eligible: function(p){ return p.alive && p.role !== 'sheriff'; },
      blockedNote: function(p){ return p.role === 'sheriff' ? 'o‘zini tekshira olmaydi' : ''; } } },
  { id:'citizen', team:'town', icon:'citizen',
    name: function(){ return 'Oddiy fuqaro'; },
    desc: function(){ return 'Sizda tungi harakat yo‘q. Kunduzgi muhokamada kuzatuv va mantiq bilan mafiyani toping va ovoz berishda uni shahardan chiqaring.'; } }
];
var TEAM_NAME = { mafia:'Mafiya jamoasi', town:'Shahar jamoasi' };
function roleDef(id){ for (var i=0;i<ROLES.length;i++) if (ROLES[i].id === id) return ROLES[i]; return null; }
function roleName(id){ var r = roleDef(id); return r ? r.name() : id; }

function playerRange(){ return S.settings.extendedRange ? [4, 20] : [8, 12]; }
function defaultCounts(n){
  var c = {}; ROLES.forEach(function(r){ c[r.id] = 0; });
  c.mafia = n >= 13 ? 4 : n >= 10 ? 3 : n >= 6 ? 2 : 1;
  c.sheriff = n >= 5 ? 1 : 0;
  c.doctor = n >= 5 ? 1 : 0;
  c.citizen = n - c.mafia - c.sheriff - c.doctor;
  return c;
}
function defaultSetup(n){ return { count:n, counts: defaultCounts(n), names: new Array(n).fill('') }; }

/* =====================================================================
   3. ILOVA HOLATI
   ===================================================================== */
var S = {
  screen: 'menu',              // menu | rules | settings | setup | reveal | host | end
  returnTo: 'menu',
  settings: Object.assign({}, DEFAULT_SETTINGS, store.get(STORE_SETTINGS) || {}),
  setup: null,
  players: [],                 // {id, name, role, alive, outRound, outCause}
  deal: null,                  // {idx, stage, started}
  game: null,
  ui: { privacy:false, logTab:'public', pick:null }
};
S.setup = defaultSetup(10);
var undoStack = [];

function saveSettings(){ store.set(STORE_SETTINGS, S.settings); }
function persist(){
  if (S.screen === 'reveal' || S.screen === 'host' || S.screen === 'end') {
    store.set(STORE_GAME, snapshotAll());
  }
}
function snapshotAll(){
  return { format:'mafia-noir', version:FORMAT_VERSION, savedAt:new Date().toISOString(),
    screen:S.screen, settings:S.settings, setup:S.setup, players:S.players, deal:S.deal, game:S.game };
}
function loadSnapshot(d){
  if (!d || d.format !== 'mafia-noir' || !Array.isArray(d.players)) throw new Error('Fayl Mafia Noir o‘yin holatiga o‘xshamaydi.');
  S.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
  S.setup = d.setup || defaultSetup(10);
  S.players = d.players; S.deal = d.deal || null; S.game = d.game || null;
  S.screen = ['reveal','host','end'].indexOf(d.screen) >= 0 ? d.screen : 'setup';
  if (S.screen === 'host' && !S.game) S.screen = 'setup';
  S.ui.pick = null; undoStack = [];
  saveSettings();
}

/* Bekor qilish (undo) — o'yin holatining nusxalari */
function pushUndo(label){
  undoStack.push({ label: label, players: clone(S.players), game: clone(S.game), screen: S.screen });
  if (undoStack.length > 60) undoStack.shift();
}
function undo(){
  var s = undoStack.pop();
  if (!s) { toast('Bekor qilinadigan harakat yo‘q.', 'warn'); return; }
  S.players = s.players; S.game = s.game; S.screen = s.screen; S.ui.pick = null;
  timerStop();
  sfx('undo');
  toast('Bekor qilindi: ' + s.label + '.', 'ok');
  render();
}

/* =====================================================================
   4. O'YIN MANTIG'I (sof funksiyalarga yaqin)
   ===================================================================== */
function alivePlayers(){ return S.players.filter(function(p){ return p.alive; }); }
function playerById(id){ for (var i=0;i<S.players.length;i++) if (S.players[i].id === id) return S.players[i]; return null; }
function countRole(role, onlyAlive){ return S.players.filter(function(p){ return p.role === role && (!onlyAlive || p.alive); }).length; }
function teamOf(p){ var r = roleDef(p.role); return r ? r.team : 'town'; }

function computeWinner(){
  var alive = alivePlayers();
  var mafia = alive.filter(function(p){ return teamOf(p) === 'mafia'; }).length;
  var others = alive.length - mafia;
  if (mafia === 0) return 'town';
  if (mafia >= others) return 'mafia';
  return null;
}

function setupErrors(){
  var e = [], st = S.setup, sum = 0;
  ROLES.forEach(function(r){ sum += st.counts[r.id] || 0; });
  var range = playerRange();
  if (st.count < range[0] || st.count > range[1]) e.push('O‘yinchilar soni ' + range[0] + '–' + range[1] + ' oralig‘ida bo‘lishi kerak.');
  if (sum !== st.count) e.push('Rollar soni (' + sum + ') o‘yinchilar soniga (' + st.count + ') teng emas. ' + (sum > st.count ? (sum - st.count) + ' ta rolni kamaytiring.' : (st.count - sum) + ' ta rol qo‘shing.'));
  if ((st.counts.mafia || 0) < 1) e.push('Kamida bitta mafiya bo‘lishi shart.');
  else if (st.counts.mafia >= st.count - st.counts.mafia) e.push('Mafiya soni shahar o‘yinchilaridan kam bo‘lishi kerak, aks holda o‘yin darhol tugaydi.');
  var seen = {}, dup = [];
  st.names.forEach(function(n){ var k = (n||'').trim().toLowerCase(); if (!k) return; if (seen[k]) dup.push(n.trim()); seen[k] = true; });
  if (dup.length) e.push('Ismlar takrorlanmasligi kerak: ' + dup.join(', ') + '.');
  return e;
}

function buildRolePool(){
  var pool = [];
  ROLES.forEach(function(r){ for (var i=0;i<(S.setup.counts[r.id]||0);i++) pool.push(r.id); });
  return pool;
}
function shuffleAndDeal(){
  var errs = setupErrors();
  if (errs.length) { toast(errs[0], 'err'); render(); return; }
  var roles = shuffleFY(buildRolePool());
  S.players = roles.map(function(role, i){
    return { id:i, name:(S.setup.names[i] || '').trim(), role:role, alive:true, outRound:null, outCause:null };
  });
  S.deal = { idx:0, stage:'welcome', started:false };
  S.game = null; undoStack = [];
  S.screen = 'reveal';
  sfx('shuffle');
  render();
}
function reshuffle(){
  if (!S.deal || S.deal.started) { toast('Rollar ko‘rila boshlangan — endi qayta aralashtirib bo‘lmaydi.', 'err'); return; }
  var roles = shuffleFY(buildRolePool());
  S.players.forEach(function(p, i){ p.role = roles[i]; });
  sfx('shuffle');
  toast('Rollar qayta aralashtirildi.', 'ok');
}

function newNight(sub){
  var steps = ROLES.filter(function(r){ return r.night && countRole(r.id) > 0; })
                   .sort(function(a,b){ return a.night.order - b.night.order; })
                   .map(function(r){ return r.id; });
  return { sub: sub || 'idle', steps: steps, i: 0, mafiaTarget:null, doctorTarget:null, sheriffTarget:null, sheriffResult:null, acted:{} };
}
function startGame(){
  if (!S.deal || S.deal.stage !== 'done') { toast('Avval barcha o‘yinchilar rolini ko‘rishi kerak.', 'err'); return; }
  S.game = { round:1, phase:'night', night:newNight('idle'), day:null, vote:null, publicLog:[], hostLog:[], winner:null, lastRound:1 };
  hostLog('O‘yin boshlandi. O‘yinchilar: ' + S.players.length + '.');
  undoStack = [];
  S.screen = 'host';
  sfx('gong');
  render();
}
function publicLog(text){ S.game.publicLog.push({ r:S.game.round, p:S.game.phase, t:text }); }
function hostLog(text){ S.game.hostLog.push({ r:S.game.round, p:S.game.phase, t:text }); }

function eliminate(p, cause){
  if (!p || !p.alive) return false;
  p.alive = false; p.outRound = S.game.round; p.outCause = cause;
  return true;
}

/* Tun natijasi: oldindan belgilangan, izchil qoidalar */
function resolveNight(){
  var n = S.game.night, victim = null, msg;
  var mt = n.mafiaTarget !== null ? playerById(n.mafiaTarget) : null;
  if (mt && mt.alive) {
    if (n.doctorTarget === mt.id) {
      hostLog('Shifokor ' + mt.name + 'ni qutqardi (mafiya nishoni).');
    } else {
      victim = mt;
    }
  } else if (n.mafiaTarget !== null) {
    hostLog('Mafiya nishoni allaqachon o‘yindan chiqqan — harakat bekor qilindi.');
  } else {
    hostLog('Mafiya bu tun nishon tanlamadi.');
  }
  if (victim) {
    eliminate(victim, 'night');
    msg = 'Tong otdi. ' + victim.name + ', siz bu tun o‘yindan chiqdingiz.';
    hostLog(victim.name + ' (' + roleName(victim.role) + ') tunda o‘yindan chiqdi.');
  } else {
    msg = 'Tong otdi. Bu tun hech kim o‘yindan chiqmadi.';
  }
  publicLog(msg);
  return { victim: victim, message: msg };
}

function tallyVotes(v){
  var t = {};
  v.candidates.forEach(function(id){ t[id] = 0; });
  Object.keys(v.votes).forEach(function(voter){
    var target = v.votes[voter];
    if (target !== 'abstain' && t.hasOwnProperty(target)) t[target]++;
  });
  return t;
}

/* =====================================================================
   5. TAYMER
   ===================================================================== */
var T = { total:0, left:0, elapsed:0, unlimited:false, running:false, id:null };
function timerSet(sec){
  timerStop(true);
  T.unlimited = !sec; T.total = sec || 0; T.left = sec || 0; T.elapsed = 0;
  paintTimer();
}
function timerStart(){
  if (T.running) return;
  if (!T.unlimited && T.left <= 0) { T.left = T.total; }
  T.running = true;
  T.id = setInterval(timerTick, 1000);
  if (S.settings.timerSounds) sfx('timerStart');
  paintTimer();
}
function timerTick(){
  if (T.unlimited) T.elapsed++;
  else {
    T.left--;
    if (T.left <= 0) {
      T.left = 0; timerStop();
      if (S.settings.timerSounds) sfx('alarm');
      toast('Vaqt tugadi. Keyingi qadamni boshlovchi hal qiladi.', 'warn');
    } else if (S.settings.timerSounds && T.left <= 10) {
      sfx(T.left <= 3 ? 'tickHi' : 'tick');
    }
  }
  paintTimer();
}
function timerStop(silent){
  T.running = false; if (T.id) clearInterval(T.id); T.id = null;
  if (!silent) paintTimer();
}
function paintTimer(){
  var c = document.querySelector('[data-clock]');
  if (c) {
    c.textContent = T.unlimited ? fmtTime(T.elapsed) : fmtTime(T.left);
    c.classList.toggle('low', !T.unlimited && T.left <= 10 && T.total > 0);
  }
  var b = document.querySelector('[data-timer-toggle]');
  if (b) { b.textContent = ''; b.appendChild(icon(T.running ? 'pause' : 'play')); b.appendChild(document.createTextNode(T.running ? 'To‘xtatish' : 'Boshlash')); }
}

/* =====================================================================
   5b. OVOZ VA MUSIQA — Web Audio orqali sintez (fayl va internetsiz)
   Muhim: rol yoki tekshiruv natijasiga qarab HECH QACHON boshqa ovoz chalinmaydi,
   aks holda ko'zini yumgan o'yinchilar ovozdan sirni bilib oladi.
   ===================================================================== */
var A = { ctx:null, master:null, musicBus:null, duckNode:null, sfxBus:null, mverb:null, sverb:null, delay:null,

function audioInit(){
  if (A.ctx) { if (A.ctx.state === 'suspended') { try { A.ctx.resume(); } catch(e){} } return A.ctx; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;

  try { c = new AC(); } catch(e){ return null; }

  var comp = c.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.01; comp.release.value = 0.25;
  A.master = c.createGain(); A.master.connect(comp); comp.connect(c.destination);
  A.duckNode = c.createGain(); A.duckNode.connect(A.master);
  A.musicBus = c.createGain(); A.musicBus.connect(A.duckNode);
  A.sfxBus = c.createGain(); A.sfxBus.connect(A.master);
  var ir = impulse(c, 3.2, 2.4);
  A.mverb = c.createConvolver(); A.mverb.buffer = ir; A.mverb.connect(A.musicBus);
  A.sverb = c.createConvolver(); A.sverb.buffer = ir; A.sverb.connect(A.sfxBus);
  A.delay = c.createDelay(2); A.delay.delayTime.value = 0.46;
  var fb = c.createGain(); fb.gain.value = 0.34;
  var dlp = c.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2200;
  var dOut = c.createGain(); dOut.gain.value = 0.55;
  A.delay.connect(dlp); dlp.connect(fb); fb.connect(A.delay); dlp.connect(dOut); dOut.connect(A.musicBus);
  A.noiseBuf = noiseBuffer(c, 2.5);
  A.loop = setInterval(musicTick, 120);

}
function impulse(c, seconds, decay){
  var len = Math.floor(c.sampleRate * seconds), buf = c.createBuffer(2, len, c.sampleRate);
  for (var ch = 0; ch < 2; ch++) { var d = buf.getChannelData(ch); for (var i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay); }
  return buf;
}
function noiseBuffer(c, seconds){
  var len = Math.floor(c.sampleRate * seconds), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random()*2-1;
  return buf;
}
function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function rnd(n){ return Math.floor(Math.random() * n); }

/* Bitta ohang: o = {bus, f, t, dur, type, g, a, r, glideTo, detune, cutoff, ft, q, vb, verb, dl, delay} */
function voice(o){
  var c = A.ctx, t = Math.max(o.t || c.currentTime, c.currentTime), dur = o.dur || 0.3;
  var osc = c.createOscillator(); osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t);
  if (o.glideTo) osc.frequency.exponentialRampToValueAtTime(o.glideTo, t + dur);
  if (o.detune) osc.detune.value = o.detune;
  var g = c.createGain(), peak = o.g || 0.1, a = Math.min(o.a || 0.01, dur * 0.9), r = Math.min(o.r || 0.2, dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + Math.max(a, dur - r));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  var node = osc;
  if (o.cutoff) { var f = c.createBiquadFilter(); f.type = o.ft || 'lowpass'; f.frequency.value = o.cutoff; f.Q.value = o.q || 0.7; osc.connect(f); node = f; }
  node.connect(g); g.connect(o.bus);
  if (o.verb && o.vb) { var s = c.createGain(); s.gain.value = o.verb; g.connect(s); s.connect(o.vb); }
  if (o.delay && o.dl) { var s2 = c.createGain(); s2.gain.value = o.delay; g.connect(s2); s2.connect(o.dl); }
  osc.start(t); osc.stop(t + dur + 0.05);
}
/* Shovqin portlashi: o = {bus, t, dur, g, ft, cutoff, cutoffTo, q, a, r, vb, verb} */
function noise(o){
  var c = A.ctx, t = Math.max(o.t || c.currentTime, c.currentTime), dur = o.dur || 0.2;
  var src = c.createBufferSource(); src.buffer = A.noiseBuf;
  var f = c.createBiquadFilter(); f.type = o.ft || 'bandpass'; f.frequency.setValueAtTime(o.cutoff || 2000, t); f.Q.value = o.q || 0.7;
  if (o.cutoffTo) f.frequency.exponentialRampToValueAtTime(o.cutoffTo, t + dur);
  var g = c.createGain(), peak = o.g || 0.05, a = Math.min(o.a || 0.005, dur * 0.9), r = Math.min(o.r || dur * 0.8, dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + Math.max(a, dur - r));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(o.bus);
  if (o.verb && o.vb) { var s = c.createGain(); s.gain.value = o.verb; g.connect(s); s.connect(o.vb); }
  src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
}

/* ---------- Musiqa: rejimlar ---------- */
function MV(tr, o){ o.bus = tr.out; o.vb = A.mverb; o.dl = A.delay; voice(o); }
function MN(tr, o){ o.bus = tr.out; o.vb = A.mverb; noise(o); }
function piano(tr, f, t, dur, g, echo){
  MV(tr, { f:f, t:t, dur:dur, type:'triangle', g:g, a:0.004, r:dur*0.95, verb:0.35, delay: echo ? 0.5 : 0 });
  MV(tr, { f:f*2, t:t, dur:dur*0.5, type:'sine', g:g*0.25, a:0.004, r:dur*0.45 });
}
function thump(tr, t, g){ MV(tr, { f:72, glideTo:40, t:t, dur:0.2, type:'sine', g:g, a:0.004, r:0.18 }); }
function loopNoise(tr, ft, cutoff, q, g){
  var c = A.ctx, src = c.createBufferSource(); src.buffer = A.noiseBuf; src.loop = true;
  var f = c.createBiquadFilter(); f.type = ft; f.frequency.value = cutoff; f.Q.value = q;
  var gn = c.createGain(); gn.gain.value = g;
  src.connect(f); f.connect(gn); gn.connect(tr.out); src.start();
  tr.loops.push(src);
}
var NOIR_CHORDS = [[48,55,58,63],[41,56,60,63],[44,55,60,63],[43,53,59,62]];   // Cm7 · Fm9 · Ab · G7
var NOIR_LICK = [72,75,77,78,79,82,84];
function noirStep(tr, t, s, gain){
  var bar = Math.floor(s/8) % 4, pos = s % 8, ch = NOIR_CHORDS[bar];
  if (pos === 0) ch.forEach(function(m, i){ piano(tr, mtof(m), t + i*0.025, 2.8, 0.045*gain); });
  if (pos === 5 && Math.random() < 0.45) ch.slice(1).forEach(function(m){ piano(tr, mtof(m), t, 1.2, 0.025*gain); });
  if (pos % 2 === 0) { var walk = [0,7,10,7][pos/2]; MV(tr, { f:mtof(ch[0]-12+walk), t:t, dur:0.55, type:'sine', g:0.15*gain, a:0.01, r:0.4 }); }
  if (pos === 2 || pos === 6) MN(tr, { t:t, dur:0.22, g:0.02*gain, ft:'bandpass', cutoff:3800, q:0.6, a:0.05, r:0.15 });
  if (pos % 2 === 1 && Math.random() < 0.2) piano(tr, mtof(NOIR_LICK[rnd(7)]), t, 1.1, 0.04*gain, true);
  if (Math.random() < 0.35) MN(tr, { t:t + Math.random()*0.2, dur:0.006, g:0.04, ft:'highpass', cutoff:3000 });   // plastinka chirsillashi
}
var MODES = {
  menu: { bpm:72, setup:null, step:function(tr, t, s){ noirStep(tr, t, s, 1); } },
  reveal: { bpm:58, setup:function(tr){ loopNoise(tr, 'lowpass', 500, 0.5, 0.05); }, step:function(tr, t, s){ noirStep(tr, t, s, 0.8); } },
  night: { bpm:64,
    setup:function(tr){ loopNoise(tr, 'bandpass', 1900, 0.45, 0.09); loopNoise(tr, 'lowpass', 260, 0.6, 0.12); },   // yomg'ir + gumburlash
    step:function(tr, t, s){
      var beat = 60/64, bar = Math.floor(s/16) % 4, pos = s % 16, ch = [[50,53,57],[46,50,53],[43,46,50],[45,49,52]][bar];
      if (pos === 0) ch.forEach(function(m){
        MV(tr, { f:mtof(m), t:t, dur:beat*8, type:'sawtooth', g:0.028, a:1.8, r:2.2, cutoff:680, verb:0.55, detune:-7 });
        MV(tr, { f:mtof(m), t:t, dur:beat*8, type:'sawtooth', g:0.028, a:1.8, r:2.2, cutoff:680, verb:0.55, detune:7 });
      });
      if (pos % 8 === 0) MV(tr, { f:mtof(ch[0]-24), t:t, dur:beat*3.5, type:'sine', g:0.24, a:0.06, r:1.6 });
      if (pos % 8 === 0) { thump(tr, t, 0.26); thump(tr, t + 0.24, 0.16); }
      if (pos % 2 === 0 && Math.random() < 0.22) MV(tr, { f:mtof([62,65,67,69,72,74][rnd(6)]), t:t, dur:1.5, type:'triangle', g:0.045, a:0.02, r:1.3, delay:0.6, verb:0.45 });
    } },
  day: { bpm:96, setup:null,
    step:function(tr, t, s){
      var bar = Math.floor(s/8) % 4, pos = s % 8, ch = [[53,57,60],[48,52,55],[50,53,57],[46,50,53]][bar];
      if (pos === 0) ch.forEach(function(m){ MV(tr, { f:mtof(m), t:t, dur:2.5, type:'triangle', g:0.032, a:0.45, r:1.3, cutoff:1700, verb:0.4 }); });
      var arp = [0,1,2,1,0,2,1,2];
      MV(tr, { f:mtof(ch[arp[pos]]+12), t:t, dur:0.32, type:'triangle', g:0.036, a:0.005, r:0.28, delay:0.3 });
      if (pos % 4 === 0) MV(tr, { f:mtof(ch[0]-12), t:t, dur:0.6, type:'sine', g:0.15, a:0.01, r:0.45 });
      if (pos % 2 === 1) MN(tr, { t:t, dur:0.06, g:0.012, ft:'highpass', cutoff:7000 });
    } },
  vote: { bpm:116, setup:null,
    step:function(tr, t, s){
      var bar = Math.floor(s/8) % 4, pos = s % 8, root = [45,41,38,40][bar], third = bar === 3 ? 4 : 3;
      MV(tr, { f:mtof(root-12), t:t, dur:0.22, type:'sawtooth', g: pos % 4 === 0 ? 0.09 : 0.05, a:0.005, r:0.18, cutoff:440 });
      MN(tr, { t:t, dur:0.04, g: pos % 2 ? 0.012 : 0.022, ft:'highpass', cutoff:8000 });
      if (pos === 0) [0, third, 7].forEach(function(i){ MV(tr, { f:mtof(root+12+i), t:t, dur:1.7, type:'sawtooth', g:0.022, a:0.03, r:1.3, cutoff:1300, verb:0.3 }); });

};
function musicTick(){
  var c = A.ctx; if (!c) return;
  var ahead = c.currentTime + 1.2;
  A.tracks.forEach(function(tr){
    if (!tr.alive) return;
    var m = MODES[tr.mode], step = 60 / m.bpm / 2;
    if (tr.next < c.currentTime) tr.next = c.currentTime + 0.05;   // fon yorlig'idan qaytganda yig'ilib qolmasin
    while (tr.next < ahead) { try { m.step(tr, tr.next, tr.step); } catch(e){} tr.step++; tr.next += step; }
  });

function musicSetMode(mode){
  if (!A.ctx || mode === A.mode) return;
  var c = A.ctx, now = c.currentTime;
  A.tracks.forEach(function(tr){
    if (!tr.alive) return;
    tr.alive = false;
    tr.out.gain.cancelScheduledValues(now);
    tr.out.gain.setValueAtTime(tr.out.gain.value, now);
    tr.out.gain.linearRampToValueAtTime(0.0001, now + 1.6);
    setTimeout(function(){ tr.loops.forEach(function(s){ try { s.stop(); } catch(e){} }); try { tr.out.disconnect(); } catch(e){} }, 2600);
  });
  A.tracks = A.tracks.filter(function(tr){ return tr.alive; });
  A.mode = mode;
  if (mode && MODES[mode]) {
    var out = c.createGain(); out.gain.setValueAtTime(0.0001, now); out.gain.linearRampToValueAtTime(1, now + 2.2); out.connect(A.musicBus);
    var tr = { mode:mode, out:out, next:now + 0.15, step:0, alive:true, loops:[] };

}
function desiredMusic(){
  if (S.screen === 'reveal') return 'reveal';
  if (S.screen === 'host' && S.game) {

    return g.day && g.day.sub === 'vote' ? 'vote' : 'day';
  }
  return 'menu';
}
function updateMusic(){
  if (!A.ctx) return;

}
function applyAudio(){
  if (!A.ctx) return;
  var s = S.settings, now = A.ctx.currentTime;
  var nightBoost = (A.mode === 'night' && s.nightMask) ? 1.7 : 1;
  A.master.gain.setTargetAtTime(s.soundOn ? s.masterVol : 0, now, 0.05);
  A.musicBus.gain.setTargetAtTime(s.musicOn ? s.musicVol * nightBoost * 0.9 : 0, now, 0.25);
  A.sfxBus.gain.setTargetAtTime(s.sfxOn ? s.sfxVol : 0, now, 0.05);

/* ---------- Ovoz effektlari ---------- */

var lastFocus = null;
function modal(title, body, actions){
  closeModal();
  lastFocus = document.activeElement;
  var root = $('#modal-root');
  var box = h('div', {class:'modal panel', role:'dialog', 'aria-modal':'true', 'aria-labelledby':'modal-title'},
    h('h3', {id:'modal-title', text:title}),
    h('div', {class:'body'}, body),
    h('div', {class:'actions'}, actions.map(function(a){
      return btn(a.label, { cls:a.cls, icon:a.icon, onClick:function(){ closeModal(); if (a.run) a.run(); } });
    }))
  );
  var back = h('div', {class:'modal-back', onclick:function(e){ if (e.target === back) closeModal(); }}, box);
  root.appendChild(back);
  sfx('soft');
  var btns = box.querySelectorAll('button'); if (btns.length) btns[btns.length-1].focus();
}
function closeModal(){
  var root = $('#modal-root');
  if (root.firstChild) { root.innerHTML = ''; if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch(e){} }
}
function confirmAction(title, text, okLabel, run, danger){
  modal(title, text, [{label:'Bekor qilish', cls:'ghost'}, {label:okLabel, cls: danger ? 'danger' : 'primary', run:run}]);
}
function toast(text, kind){
  // Xatolar har doim ko'rsatiladi; qolgan bildirishnomalarni sozlamada o'chirish mumkin.
  if (kind === 'err') sfx('error');
  else if (!S.settings.notifications) return;
  else sfx('notify');
  var t = h('div', {class:'toast ' + (kind || ''), text:text});
  $('#toasts').appendChild(t);
  setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, kind === 'err' ? 5200 : 3200);
}

function render(){
  var app = $('#app');
  var focusId = document.activeElement && document.activeElement.id;
  var scrolls = {};
  app.querySelectorAll('[data-scroll]').forEach(function(el){ scrolls[el.getAttribute('data-scroll')] = el.scrollTop; });
  app.innerHTML = '';
  var view = ({ menu:viewMenu, rules:viewRules, settings:viewSettings, setup:viewSetup, reveal:viewReveal, host:viewHost, end:viewEnd })[S.screen] || viewMenu;
  app.appendChild(view());
  app.querySelectorAll('[data-scroll]').forEach(function(el){ var k = el.getAttribute('data-scroll'); if (scrolls[k]) el.scrollTop = scrolls[k]; });
  if (focusId) { var f = document.getElementById(focusId); if (f) try { f.focus({preventScroll:true}); } catch(e){ f.focus(); } }
  paintTimer();
  persist();
  updateMusic();
  updateDock();
}

function clampSetupCount(){
  var r = playerRange(), st = S.setup;
  if (st.count < r[0]) setCount(r[0], true);
  if (st.count > r[1]) setCount(r[1], true);
}
function setCount(n, silent){
  var st = S.setup, r = playerRange();
  n = Math.max(r[0], Math.min(r[1], n));
  var diff = n - st.count;
  st.count = n;
  st.names = st.names.slice(0, n); while (st.names.length < n) st.names.push('');
  st.counts.citizen = Math.max(0, (st.counts.citizen || 0) + diff);
  if (!silent) render();
}

/* ---------- Maxfiy rol ko'rish ---------- */

}
function nameTaken(name, exceptIdx){

}

        !d.started ? btn('Qayta aralashtirish', { cls:'ghost sm', icon:'shuffle', onClick:function(){ reshuffle(); } }) : null,

      h('div', {class:'actions', style:'justify-content:center'},
        btn('Ismni o‘zgartirish', { cls:'ghost', icon:'back', onClick:function(){ d.stage = 'welcome'; render(); } }),
        btn('Rolimni ko‘rish', { cls:'primary lg', icon:'eye', id:'btn-show-role', onClick:function(){ d.started = true; d.stage = 'shown'; sfx('reveal'); render(); var b = $('#btn-hide-role'); if (b) b.focus(); } })

        d.idx++;

/* ----- Tun ----- */

      h('div', {class:'stage-actions'}, h('span', {class:'grow'}), btn('Tunni boshlash', { cls:'primary lg', icon:'moon', id:'btn-night', primary:true, onClick:function(){ pushUndo('tunni boshlash'); n.sub = 'intro'; sfx('nightfall'); render(); } }))];
  }

    return [head,
      h('div', {class:'announce cinema'}, 'Tun tushdi.', h('span', {class:'sub', text:'Barcha ko‘zlarini yumsin.'})),
      h('div', {class:'stage-actions'}, h('span', {class:'grow'}), btn('Davom etish', { cls:'primary lg', icon:'next', id:'btn-continue', primary:true, onClick:function(){ n.sub = n.steps.length ? 'open' : 'dawn'; n.i = 0; S.ui.pick = null; if (n.steps.length) sfx('wake'); render(); } }))];
  }
  if (n.sub === 'open') return [head].concat(stageNightOpen());
  if (n.sub === 'close') {
    var r = roleDef(n.steps[n.i]);
    var extra = null;
    if (r.id === 'sheriff' && n.sheriffTarget !== null) extra = privateSheriff(n);
    return [head,
      extra,
      h('div', {class:'announce'}, r.name() + ', ko‘zlaringizni yuming.'),
      h('div', {class:'stage-actions'}, h('span', {class:'grow'}), btn('Davom etish', { cls:'primary lg', icon:'next', id:'btn-continue', primary:true, onClick:function(){
        n.i++; S.ui.pick = null;
        n.sub = n.i < n.steps.length ? 'open' : 'dawn';
        if (n.sub === 'open') sfx('wake');
        render(); } }))];
  }
  if (n.sub === 'dawn') {
    var nm = function(id){ var p = id === null ? null : playerById(id); return p ? p.name : '— tanlanmagan —'; };

    if (n.steps.indexOf('mafia') >= 0) rows.push(h('dt', {text:'Mafiya nishoni'}), h('dd', {text:nm(n.mafiaTarget)}));
    if (n.steps.indexOf('doctor') >= 0) rows.push(h('dt', {text:'Shifokor himoyasi'}), h('dd', {text:nm(n.doctorTarget)}));
    if (n.steps.indexOf('sheriff') >= 0) rows.push(h('dt', {text:S.settings.sheriffName + ' tekshiruvi'}), h('dd', {text: nm(n.sheriffTarget) + (n.sheriffTarget !== null ? (n.sheriffResult ? ' — MAFIYA' : ' — mafiya emas') : '')}));
    return [head,
      h('div', {class:'announce'}, 'Tungi harakatlar yakunlandi.', h('span', {class:'sub', text:'Natijani faqat siz ko‘ryapsiz. Tayyor bo‘lsangiz, tongni oching.'})),
      h('div', {class:'private secret'}, h('span', {class:'eyebrow'}, icon('lock'), 'Maxfiy · faqat boshlovchi'), h('dl', {class:'kv'}, rows)),
      h('div', {class:'stage-actions'},
        h('span', {class:'grow muted', text:'Xato bo‘lsa, «Bekor qilish» bilan oldingi tanlovga qayting.'}),
        btn('Tongni ochish', { cls:'primary lg', icon:'sun', id:'btn-dawn', primary:true, onClick:openDawn }))];
  }
  return [head];
}
function privateSheriff(n){

  return h('div', {class:'private secret'},
    h('span', {class:'eyebrow'}, icon('lock'), 'Maxfiy · ' + S.settings.sheriffName + ' tekshiruvi'),
    h('div', {class:'verdict ' + (n.sheriffResult ? 'is-mafia' : 'not-mafia'), text:'Tekshiruv natijasi: ' + (n.sheriffResult ? 'MAFIYA' : 'MAFIYA EMAS')}),
    h('p', {class:'muted', text: t.name + (n.sheriffResult ? ' — mafiya. ' + S.settings.sheriffName + ' uni tekshiruv bilan chiqara olmaydi; kunduzi dalil bilan ishontirishi kerak.' : ' — mafiya emas.') + ' Natijani ' + S.settings.sheriffName + 'ga jim imo bilan bildiring.'})
  );
}
function stageNightOpen(){
  var n = S.game.night, r = roleDef(n.steps[n.i]), act = r.night;
  var actorsAlive = countRole(r.id, true);
  var announce = h('div', {class:'announce'}, r.name() + ', ko‘zlaringizni oching.');
  if (actorsAlive === 0) {
    return [announce,
      cue('Bu rol egalari o‘yindan chiqqan. Sir saqlanishi uchun chaqiruvni odatdagidek o‘qing, biroz kuting va davom eting.'),
      h('div', {class:'stage-actions'}, h('span', {class:'grow'}), btn('Davom etish (harakatsiz)', { cls:'primary', icon:'next', id:'btn-skip', primary:true, onClick:function(){ confirmNight(null); } }))];
  }
  var grid = h('div', {class:'pick-grid', role:'group', 'aria-label':act.prompt()}, S.players.map(function(p){
    var eligible = act.eligible(p);
    var note = !p.alive ? 'o‘yindan chiqqan' : (!eligible ? (act.blockedNote(p) || 'tanlab bo‘lmaydi') : '');
    var b = h('button', {type:'button', id:'pick-'+p.id, class:'pick ' + (act.tone === 'kill' ? 'kill ' : '') + (p.alive ? '' : 'dead'),
      'aria-pressed': String(S.ui.pick === p.id), disabled: !eligible,
      onclick:function(){ S.ui.pick = S.ui.pick === p.id ? null : p.id; render(); }},
