    h('div', {class:'stage-actions'},
      btn('Tanlovsiz o‘tkazish', { cls:'ghost', icon:'x', onClick:function(){
        confirmAction('Tanlovsiz o‘tkazish', r.name() + ' bu tun hech kimni tanlamaganini qayd etamizmi?', 'Ha, o‘tkazish', function(){ confirmNight(null); }); } }),
      h('span', {class:'grow'}),
      btn(act.confirm, { cls:'primary lg', icon:'check', id:'btn-confirm', primary:true, disabled: S.ui.pick === null, onClick:function(){ confirmNight(S.ui.pick); } })
    )];
}
function confirmNight(targetId){
  var n = S.game.night, r = roleDef(n.steps[n.i]);
  if (targetId !== null) {
    var p = playerById(targetId);
    if (!p || !r.night.eligible(p)) { toast('Bu o‘yinchini tanlab bo‘lmaydi.', 'err'); return; }
  }
  pushUndo(r.name() + ' tanlovi');
  n[r.night.key] = targetId;
  n.acted[r.id] = true;
  if (r.id === 'sheriff') {
    n.sheriffResult = targetId !== null ? teamOf(playerById(targetId)) === 'mafia' : null;
    if (targetId !== null) hostLog(S.settings.sheriffName + ' tekshiruvi: ' + playerById(targetId).name + ' — ' + (n.sheriffResult ? 'MAFIYA' : 'mafiya emas') + '.');
  } else if (targetId !== null) {
    hostLog(r.name() + ' tanlovi: ' + playerById(targetId).name + '.');
  } else {
    hostLog(r.name() + ' bu tun tanlov qilmadi.');
  }
  S.ui.pick = null;
  n.sub = 'close';
  // Bir xil tovush: tanlov, o'tkazish yoki tekshiruv natijasi ovozdan bilinmaydi
  sfx('confirm'); sfx('sleep', 0.35);
  render();
}
function openDawn(){
  var n = S.game.night;
  if (n.sub !== 'dawn' || n.i < n.steps.length) { toast('Tungi harakatlar hali yakunlanmagan.', 'err'); return; }
  pushUndo('tongni ochish');
  var res = resolveNight();
  var msg = res.message;
  if (res.victim && S.settings.revealRoleOnNight) msg += ' Uning roli: ' + roleName(res.victim.role) + '.';
  S.game.phase = 'day';
  S.game.day = { sub:'announce', message:msg, victimId: res.victim ? res.victim.id : null, pendingWinner: computeWinner(), voteMessage:null };
  S.game.vote = null;
  sfx('dawn');
  sfx(res.victim ? 'death' : 'saved', 1.7);
  render();
}

/* ----- Kunduz ----- */
function stageDay(){
  var g = S.game, d = g.day;
  var head = h('div', {class:'stage-head'}, phaseTag('Kunduz · ' + g.round + '-raund', 'sun'),
    h('span', {class:'eyebrow', text: ({announce:'Tong xabari', open:'Uyg‘onish', discussion:'Muhokama', vote:'Ovoz berish', voteResult:'Ovoz natijasi'})[d.sub] || ''}));

  if (d.sub === 'announce') {
    return [head,
      h('div', {class:'announce cinema'}, d.message),
      d.victimId !== null ? cue('O‘yindan chiqqan o‘yinchining ismini tasdiqlang va e’lon qiling. U endi gapirmaydi va ovoz bermaydi.') : null,
      h('div', {class:'stage-actions'}, h('span', {class:'grow'}),
        btn(d.pendingWinner ? 'Natijalarni ko‘rish' : 'Davom etish', { cls:'primary lg', icon:'next', id:'btn-continue', primary:true, onClick:function(){
          if (d.pendingWinner) { endGame(d.pendingWinner); return; }
          d.sub = 'open'; sfx('wake'); render(); } }))];
  }
  if (d.sub === 'open') {
    return [head,
      h('div', {class:'announce cinema'}, 'Barcha ko‘zlarini ochsin.', h('span', {class:'sub', text:'Kunduz boshlandi.'})),
      h('div', {class:'stage-actions'}, h('span', {class:'grow'}),
        btn('Muhokamani boshlash', { cls:'primary lg', icon:'next', id:'btn-discuss', primary:true, onClick:function(){
          d.sub = 'discussion'; timerSet(S.settings.discussionDefault); sfx('gong'); render(); } }))];
  }
  if (d.sub === 'discussion') return [head].concat(stageDiscussion());
  if (d.sub === 'vote') return [head].concat(stageVote());
  if (d.sub === 'voteResult') {
    return [head,
      h('div', {class:'announce'}, d.voteMessage),
      h('div', {class:'stage-actions'}, h('span', {class:'grow'}),
        d.pendingWinner
          ? btn('Natijalarni ko‘rish', { cls:'primary lg', icon:'next', id:'btn-end', primary:true, onClick:function(){ endGame(d.pendingWinner); } })
          : btn('Tunni boshlash', { cls:'primary lg', icon:'moon', id:'btn-night', primary:true, onClick:startNextNight }))];
  }
  return [head];
}
function timerBlock(presets){
  var seg = h('div', {class:'seg', role:'group', 'aria-label':'Vaqtni tanlash'}, presets.map(function(p){
    return h('button', {type:'button', 'aria-pressed': String((T.unlimited && p[0] === 0) || (!T.unlimited && T.total === p[0])), text:p[1],
      onclick:function(){ timerSet(p[0]); render(); }});
  }));
  return h('div', {class:'timer'},
    h('div', {class:'clock', 'data-clock':'1', 'aria-live':'off'}),
    h('div', {class:'actions'},
      h('button', {type:'button', class:'btn', 'data-timer-toggle':'1', id:'timer-toggle', onclick:function(){ T.running ? timerStop() : timerStart(); }}),
      btn('Qayta', { cls:'ghost', icon:'reset', onClick:function(){ timerSet(T.unlimited ? 0 : T.total); } }),
      seg)
  );
}
function stageDiscussion(){
  var voting = S.settings.votingEnabled;
  return [
    h('div', {class:'announce'}, 'Muhokama.', h('span', {class:'sub', text:'O‘yinchilar dalil keltiradi va shubhalarini aytadi.'})),
    timerBlock([[60,'1 daq'],[120,'2 daq'],[180,'3 daq'],[0,'Cheklanmagan']]),
    cue('Taymer tugashi hech kimni chiqarmaydi. Bosqichni siz yakunlaysiz.' + (voting ? '' : ' Ovoz berish o‘chirilgan: kerak bo‘lsa, o‘yinchini ro‘yxatdan qo‘lda chiqaring.')),
    h('div', {class:'stage-actions'},
      h('span', {class:'grow'}),
      voting
        ? btn('Ovoz berishga o‘tish', { cls:'primary lg', icon:'ballot', id:'btn-vote', primary:true, onClick:function(){ timerStop(); startVote(null, 1); } })
        : btn('Tunni boshlash', { cls:'primary lg', icon:'moon', id:'btn-night', primary:true, onClick:startNextNight })
    )
  ];
}
function startVote(candidates, round){
  var d = S.game.day;
  pushUndo(round === 1 ? 'ovoz berishni boshlash' : 'qayta ovoz berish');
  S.game.vote = { round: round, candidates: candidates || alivePlayers().map(function(p){ return p.id; }), votes:{} };
  d.sub = 'vote';
  timerSet(S.settings.voteTimer);
  if (round === 1) publicLog('Ovoz berish boshlandi.');
  sfx('gavel');
  render();
}
function stageVote(){
  var v = S.game.vote, alive = alivePlayers();
  var tally = tallyVotes(v);
  var voted = alive.filter(function(p){ return v.votes[p.id] !== undefined; }).length;
  var max = 0; Object.keys(tally).forEach(function(k){ if (tally[k] > max) max = tally[k]; });

  var rows = h('div', {class:'vote-list', 'data-scroll':'votes'}, alive.map(function(p){
    var cur = v.votes[p.id];
    var sel = h('select', {id:'vote-'+p.id, 'aria-label':p.name + ' ovozi', onchange:function(e){
      var val = e.target.value;
      if (val === '') delete v.votes[p.id];
      else v.votes[p.id] = val === 'abstain' ? 'abstain' : Number(val);
      render();
    }});
    sel.appendChild(h('option', {value:'', text:'— ovoz bermagan —'}));
    v.candidates.forEach(function(cid){
      if (cid === p.id && !S.settings.allowSelfVote) return;
      var c = playerById(cid);
      var o = h('option', {value:String(cid), text:'→ ' + c.name});
      if (cur === cid) o.selected = true;
      sel.appendChild(o);
    });
    if (S.settings.allowAbstain) { var a = h('option', {value:'abstain', text:'Betaraf'}); if (cur === 'abstain') a.selected = true; sel.appendChild(a); }
    if (cur === undefined) sel.value = '';
    return h('div', {class:'vote-row' + (cur === undefined ? ' missing' : '')}, h('span', {class:'vn', text:p.name}), sel);
  }));

  var bars = h('div', {class:'tally'}, v.candidates.slice().sort(function(a,b){ return tally[b] - tally[a]; }).map(function(cid){
    var c = playerById(cid), n = tally[cid];
    return h('div', {class:'tbar' + (n > 0 && n === max ? ' lead' : '')},
      h('div', {class:'tn'}, h('span', {text:c.name}), h('div', {class:'tr'}, h('i', {style:'width:' + (alive.length ? (n / alive.length * 100) : 0) + '%'}))),
      h('span', {class:'tc', text:String(n)}));
  }));

  return [
    h('div', {class:'announce'}, v.round === 1 ? 'Ovoz berish.' : 'Qayta ovoz berish.', h('span', {class:'sub', text: v.round === 1 ? 'Har bir tirik o‘yinchi kimni chiqarishni aytadi.' : 'Faqat teng ovoz olganlar orasidan tanlanadi.'})),
    timerBlock([[30,'30 s'],[60,'1 daq'],[120,'2 daq'],[0,'Cheklanmagan']]),
    h('div', {class:'vote-meta'},
      h('span', null, 'Ovoz berdi: ', h('b', {text:String(voted)})),
      h('span', null, 'Hali bermadi: ', h('b', {text:String(alive.length - voted)})),
      h('span', null, 'Jami tirik: ', h('b', {text:String(alive.length)})),
      S.settings.allMustVote ? h('span', {text:'Hamma ovoz berishi shart'}) : null),
    h('div', {class:'vote-wrap'}, rows, bars),
    h('div', {class:'stage-actions'},
      btn('Ovoz berishni bekor qilish', { cls:'ghost', icon:'x', onClick:function(){
        confirmAction('Ovoz berishni bekor qilish', 'Belgilangan ovozlar o‘chadi va muhokamaga qaytiladi.', 'Bekor qilish', function(){
          pushUndo('ovoz berishni bekor qilish'); S.game.vote = null; S.game.day.sub = 'discussion'; timerSet(S.settings.discussionDefault); render(); }, true); } }),
      btn('Ovozlarni tozalash', { cls:'ghost', icon:'reset', onClick:function(){ v.votes = {}; timerSet(S.settings.voteTimer); render(); } }),
      h('span', {class:'grow'}),
      btn('Ovozlarni yakunlash', { cls:'primary lg', icon:'check', id:'btn-finish-vote', primary:true, onClick:finishVote })
    )
  ];
}
function finishVote(){
  var g = S.game, v = g.vote, d = g.day, alive = alivePlayers();
  var missing = alive.filter(function(p){ return v.votes[p.id] === undefined; });
  if (S.settings.allMustVote && missing.length) {
    toast(missing.length + ' o‘yinchi hali ovoz bermadi: ' + missing.map(function(p){ return p.name; }).join(', ') + '.', 'err');
    return;
  }
  var tally = tallyVotes(v), max = 0, top = [];
  Object.keys(tally).forEach(function(k){ if (tally[k] > max) max = tally[k]; });
  if (max > 0) Object.keys(tally).forEach(function(k){ if (tally[k] === max) top.push(Number(k)); });
  var summary = v.candidates.filter(function(id){ return tally[id] > 0; }).map(function(id){ return playerById(id).name + ': ' + tally[id]; }).join(', ');
  hostLog('Ovozlar (' + v.round + '-tur): ' + (summary || 'hech kim ovoz olmadi') + '.');

  if (top.length > 1) {
    var canRevote = S.settings.tieRule === 'revote' && S.settings.revoteEnabled && v.round === 1;
    if (canRevote) {
      publicLog('Ovozlar teng: ' + top.map(function(id){ return playerById(id).name; }).join(', ') + '. Qayta ovoz berish.');
      timerStop();
      sfx('tie');
      startVote(top, 2);
      toast('Ovozlar teng — teng ovoz olganlar orasida qayta ovoz berish.', 'warn');
      return;
    }
  }
  pushUndo('ovozlarni yakunlash');
  timerStop();
  var msg;
  if (max === 0) msg = 'Hech kim ovoz olmadi. Bu kun hech kim chiqarilmadi.';
  else if (top.length > 1) msg = 'Ovozlar teng (' + top.map(function(id){ return playerById(id).name; }).join(', ') + '). Bu kun hech kim chiqarilmadi.';
  else {
    var p = playerById(top[0]);
    eliminate(p, 'vote');
    msg = p.name + ' ovoz berish natijasida o‘yindan chiqarildi (' + max + ' ovoz).';
    if (S.settings.revealRoleOnVote) msg += ' Uning roli: ' + roleName(p.role) + '.';
    hostLog(p.name + ' (' + roleName(p.role) + ') ovoz bilan chiqarildi.');
  }
  publicLog(msg);
  sfx(max > 0 && top.length === 1 ? 'eliminate' : 'tie');
  d.voteMessage = msg;
  d.sub = 'voteResult';
  d.pendingWinner = computeWinner();
  render();
}
function startNextNight(){
  pushUndo('tunni boshlash');
  timerStop();
  S.game.round++;
  S.game.phase = 'night';
  S.game.night = newNight('intro');
  S.game.day = null; S.game.vote = null;
  sfx('nightfall');
  render();
}
function manualEliminate(p){
  var d = S.game.day;
  confirmAction('O‘yinchini chiqarish', p.name + ' boshlovchi qarori bilan o‘yindan chiqariladi. Bu harakatni «Bekor qilish» bilan qaytarish mumkin.', 'Chiqarish', function(){
    pushUndo(p.name + 'ni chiqarish');
    eliminate(p, 'host');
    sfx('eliminate');
    publicLog(p.name + ' boshlovchi qarori bilan o‘yindan chiqarildi.');
    hostLog(p.name + ' (' + roleName(p.role) + ') boshlovchi tomonidan chiqarildi.');
    var w = computeWinner();
    if (w) { endGame(w); return; }
    if (d && S.game.vote) { delete S.game.vote.votes[p.id]; S.game.vote.candidates = S.game.vote.candidates.filter(function(id){ return id !== p.id; }); }
    render();
  }, true);
}
function endGame(w){
  timerStop();
  S.game.winner = w;
  S.game.lastRound = S.game.round;
  sfx(w === 'mafia' ? 'winMafia' : 'winTown');
  hostLog('O‘yin yakunlandi: ' + (w === 'mafia' ? 'mafiya' : 'shahar') + ' g‘alabasi.');
  S.screen = 'end';
  render();
  window.scrollTo(0,0);
}

/* ----- O'yinchilar ro'yxati ----- */
function viewPlayerList(){
  var g = S.game, n = g.night, v = g.vote;
  var canKick = g.phase === 'day' && g.day && (g.day.sub === 'discussion' || g.day.sub === 'voteResult' || g.day.sub === 'open');
  var tally = v ? tallyVotes(v) : null;
  var list = h('div', {'data-scroll':'players'}, S.players.map(function(p){
    var r = roleDef(p.role);
    var meta = [
      h('span', {class:'chip secret r-' + p.role}, icon(r.icon), r.name()),
      h('span', {class:'chip ' + (p.alive ? 'alive' : 'dead'), text: p.alive ? 'Tirik' : 'Chiqqan · ' + p.outRound + '-r'})
    ];
    if (g.phase === 'night') {
      if (n.mafiaTarget === p.id) meta.push(h('span', {class:'chip secret tgt-k', text:'Mafiya nishoni'}));
      if (n.doctorTarget === p.id) meta.push(h('span', {class:'chip secret tgt-d', text:'Himoyada'}));
      if (n.sheriffTarget === p.id) meta.push(h('span', {class:'chip secret tgt-s', text:'Tekshirildi'}));
    }
    if (v && p.alive) {
      var my = v.votes[p.id];
      meta.push(h('span', {class:'chip vote', text: my === undefined ? 'Ovoz bermagan' : my === 'abstain' ? 'Betaraf' : '→ ' + playerById(my).name}));
      if (tally && tally.hasOwnProperty(p.id) && tally[p.id] > 0) meta.push(h('span', {class:'chip tgt-k', text: tally[p.id] + ' ovoz'}));
    }
    return h('div', {class:'prow' + (p.alive ? '' : ' out')},
      h('span', {class:'seat', text:String(p.id + 1)}),
      h('div', {class:'pmain'}, h('span', {class:'pname', text:p.name}), h('div', {class:'pmeta'}, meta)),
      canKick && p.alive ? btn('', { cls:'sm ghost icon', icon:'out', aria:p.name + 'ni chiqarish', title:'Boshlovchi qarori bilan chiqarish', onClick:function(){ manualEliminate(p); } }) : h('span')
    );
  }));
  return h('div', {class:'panel plist'},
    h('div', {class:'plist-head'}, h('h3', {text:'O‘yinchilar'}), h('span', {class:'eyebrow', text: alivePlayers().length + ' tirik'})),
    list);
}
function viewLogs(){
  var g = S.game, tab = S.ui.logTab;
  var items = (tab === 'public' ? g.publicLog : g.hostLog).slice().reverse();
  var tabBtn = function(id, label){
    return h('button', {type:'button', role:'tab', id:'tab-'+id, 'aria-selected': String(tab === id), onclick:function(){ S.ui.logTab = id; render(); }, text:label});
  };
  return h('div', {class:'panel logs'},
    h('div', {class:'tabs', role:'tablist'}, tabBtn('public', 'Ommaviy jurnal'), tabBtn('host', 'Maxfiy jurnal')),
    h('ul', {class:'loglist' + (tab === 'host' ? ' secret' : ''), 'data-scroll':'log-' + tab},
      items.length ? items.map(function(it){
        return h('li', null, h('span', {class:'lr', text: it.r + '-' + (it.p === 'night' ? 'T' : 'K')}), h('span', {text:it.t}));
      }) : h('li', null, h('span', {class:'empty', text:'Hozircha yozuv yo‘q.'})))
  );
}

/* ---------- Yakun ---------- */
function viewEnd(){
  var g = S.game, w = g.winner;
  var causeTxt = { night:'Tunda', vote:'Ovoz bilan', host:'Boshlovchi qarori' };
  var rows = S.players.slice().sort(function(a,b){ return (teamOf(a) === w ? 0 : 1) - (teamOf(b) === w ? 0 : 1) || a.id - b.id; }).map(function(p){
    var r = roleDef(p.role);
    return h('tr', {class: teamOf(p) === w ? 'winner' : ''},
      h('td', null, h('b', {text:p.name})),
      h('td', null, h('span', {class:'chip r-' + p.role}, icon(r.icon), r.name())),
      h('td', {class:'muted', text:TEAM_NAME[r.team]}),
      h('td', {text: p.alive ? 'Tirik qoldi' : causeTxt[p.outCause] || 'Chiqqan'}),
      h('td', {class:'mono', text: p.alive ? '—' : String(p.outRound)})
    );
  });
  return h('div', {class:'page'},
    h('div', {class:'panel end-hero ' + w},
      h('span', {class:'eyebrow', text:'O‘yin yakunlandi'}),
      h('h1', {text: w === 'mafia' ? 'Mafiya g‘alaba qozondi' : 'Shahar g‘alaba qozondi'}),
      h('p', {class:'muted', text: (w === 'mafia' ? 'Mafiya shaharni egalladi.' : 'Barcha mafiya a’zolari fosh etildi.') + ' O‘yin ' + g.lastRound + ' raund davom etdi.'})
    ),
    h('div', {class:'panel'},
      h('div', {class:'table-wrap'},
        h('table', null,
          h('thead', null, h('tr', null, ['O‘yinchi','Rol','Jamoa','Holat','Chiqqan raund'].map(function(t){ return h('th', {text:t}); }))),
          h('tbody', null, rows)))
    ),
    h('div', {class:'actions'},
      btn('Bekor qilish', { cls:'ghost', icon:'undo', disabled: undoStack.length === 0, onClick:undo, title:'Oxirgi harakatni qaytarib, o‘yinni davom ettirish' }),
      btn('Eksport', { cls:'ghost', icon:'download', onClick:exportGame }),
      h('span', {class:'grow'}),
      btn('Bosh menyu', { icon:'back', onClick:function(){ go('menu'); } }),
      btn('Shu ismlar bilan yangi o‘yin', { cls:'primary', icon:'shuffle', id:'btn-again', onClick:function(){
        S.setup.names = S.players.slice().sort(function(a,b){ return a.id - b.id; }).map(function(p){ return p.name; });
        while (S.setup.names.length < S.setup.count) S.setup.names.push('');
        S.setup.names = S.setup.names.slice(0, S.setup.count);
        store.del(STORE_GAME);
        S.game = null; S.players = []; S.deal = null; undoStack = [];
        go('setup'); } })
    )
  );
}

/* =====================================================================
   8. EKSPORT / IMPORT
   ===================================================================== */
function exportGame(){
  try {
    var data = JSON.stringify(snapshotAll(), null, 2);
    var blob = new Blob([data], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = h('a', {href:url, download:'mafia-noir-' + (S.game ? S.game.round + '-raund' : 'holat') + '.json'});
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    toast('O‘yin holati JSON faylga saqlandi.', 'ok');
  } catch(e) { toast('Eksport qilib bo‘lmadi: ' + e.message, 'err'); }
}
function openImport(){ var f = $('#import-file'); f.value = ''; f.click(); }
$('#import-file').addEventListener('change', function(e){
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var rd = new FileReader();
  rd.onload = function(){
    try { loadSnapshot(JSON.parse(rd.result)); render(); toast('O‘yin fayldan tiklandi.', 'ok'); }
    catch(err) { toast('Faylni o‘qib bo‘lmadi: ' + err.message, 'err'); }
  };
  rd.readAsText(file);
});

/* =====================================================================
   9. GLOBAL HODISALAR
   ===================================================================== */
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && $('#modal-root').firstChild) { e.preventDefault(); closeModal(); }
});
window.addEventListener('beforeunload', function(e){
  if (S.screen === 'reveal' || S.screen === 'host') { persist(); e.preventDefault(); e.returnValue = ''; }
});

/* Brauzer ovozni faqat foydalanuvchi harakatidan keyin ruxsat beradi */
function unlockAudio(){ if (audioInit()) updateMusic(); }
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('keydown', unlockAudio, true);
/* Tugma bosilganda yengil tovush */
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('button');
  if (b && !b.disabled && !b.classList.contains('dock-btn')) sfx('click');
}, true);
/* M — musiqani yoqish/o'chirish (matn maydonida emas) */
document.addEventListener('keydown', function(e){
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey && !e.altKey && tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') {
    setAudio('musicOn', !S.settings.musicOn);
    toast(S.settings.musicOn ? 'Musiqa yoqildi.' : 'Musiqa o‘chirildi.', 'ok');
  }
});

/* Test va kengaytirish uchun ochiq interfeys */
window.MafiaNoir = { state:function(){ return S; }, audio:A, sfx:sfx, ROLES:ROLES, shuffleFY:shuffleFY, computeWinner:computeWinner, render:render };

render();
})();
</script>
